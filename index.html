<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07182d" />
  <title>Null Neun Air – Barcelona 2027</title>

  <style>
    :root {
      --blue: #0866d9;
      --blue-dark: #0547a7;
      --blue-deep: #032f77;
      --yellow: #f7d117;
      --white: #ffffff;
      --ink: #07182d;
      --bg: #e9efec;
      --shadow: 0 24px 65px rgba(4, 20, 38, 0.22);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 16% 18%, rgba(91, 159, 246, 0.18), transparent 27%),
        radial-gradient(circle at 84% 28%, rgba(247, 209, 23, 0.13), transparent 23%),
        radial-gradient(circle at 64% 84%, rgba(120, 146, 170, 0.18), transparent 28%),
        linear-gradient(180deg, #eef2ef 0%, #e1e7e3 100%);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    button {
      font: inherit;
    }

    .experience {
      width: min(100%, 390px);
      min-height: 610px;
      position: relative;
      display: grid;
      place-items: center;
      perspective: 1400px;
    }

    /* -----------------------------
       PACK
    ----------------------------- */

    .pack-button {
      width: 286px;
      height: 468px;
      position: absolute;
      z-index: 10;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      transform-style: preserve-3d;
      filter: drop-shadow(0 30px 32px rgba(2, 14, 29, 0.28));
      transition: opacity 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .pack-button:focus-visible {
      outline: 4px solid rgba(247, 209, 23, 0.7);
      outline-offset: 8px;
    }

    .pack {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background:
        linear-gradient(112deg, transparent 0 22%, rgba(255,255,255,0.14) 29%, transparent 38%),
        radial-gradient(circle at 75% 24%, rgba(247, 209, 23, 0.20), transparent 22%),
        linear-gradient(150deg, #0a213a 0%, #07172a 44%, #020912 100%);
      border: 1px solid rgba(255,255,255,0.17);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.23),
        inset 0 -2px 0 rgba(0,0,0,0.4);
      transform-origin: center bottom;
      animation: packFloat 3.2s ease-in-out infinite;
    }

    .pack::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.48;
      background:
        repeating-linear-gradient(
          115deg,
          transparent 0 17px,
          rgba(255,255,255,0.035) 18px 19px,
          transparent 20px 36px
        );
      pointer-events: none;
    }

    .pack::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(247, 209, 23, 0.28);
      border-radius: 16px;
      pointer-events: none;
    }

    .pack-seal {
      position: absolute;
      left: 0;
      right: 0;
      height: 31px;
      background:
        repeating-linear-gradient(
          90deg,
          #c8a900 0 7px,
          #f7d117 7px 14px,
          #ffe760 14px 18px
        );
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.4),
        inset 0 -2px 0 rgba(0,0,0,0.28);
      z-index: 4;
    }

    .pack-seal.top {
      top: 0;
      border-radius: 22px 22px 0 0;
      transform-origin: right center;
    }

    .pack-seal.bottom {
      bottom: 0;
      border-radius: 0 0 22px 22px;
    }

    .tear-line {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 44px;
      height: 1px;
      border-top: 2px dashed rgba(255,255,255,0.42);
      z-index: 5;
    }

    .tear-line::after {
      content: "HIER ÖFFNEN";
      position: absolute;
      right: 0;
      top: 7px;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12rem;
      color: rgba(255,255,255,0.58);
    }

    .pack-content {
      position: absolute;
      inset: 62px 24px 48px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .edition {
      margin-top: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22rem;
      color: var(--yellow);
    }

    .pack-logo {
      width: 112px;
      height: 112px;
      margin-top: 46px;
      border-radius: 50%;
      border: 3px solid var(--yellow);
      display: grid;
      place-items: center;
      color: var(--yellow);
      font-size: 3.1rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.12em;
      text-indent: -0.12em;
      box-shadow:
        0 0 0 9px rgba(247, 209, 23, 0.07),
        0 0 38px rgba(247, 209, 23, 0.12);
    }

    .pack-title {
      margin-top: 30px;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.16rem;
      text-transform: uppercase;
    }

    .pack-subtitle {
      margin-top: 9px;
      font-size: 0.76rem;
      letter-spacing: 0.11rem;
      color: rgba(255,255,255,0.72);
    }

    .tap-hint {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--ink);
      background: var(--yellow);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.04rem;
      box-shadow: 0 10px 26px rgba(247, 209, 23, 0.16);
      animation: hintPulse 1.7s ease-in-out infinite;
    }

    .tap-icon {
      font-size: 1rem;
      transform: translateY(-1px);
    }

    /* -----------------------------
       BOARDING CARD
    ----------------------------- */

    .ticket-wrap {
      width: 100%;
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(94px) scale(0.82) rotateX(12deg);
      filter: blur(6px);
      pointer-events: none;
    }

    .ticket {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 24px 22px 22px;
      background:
        radial-gradient(circle at 95% 90%, rgba(255,255,255,0.17), transparent 30%),
        linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 72%, var(--blue-deep) 100%);
      box-shadow: var(--shadow);
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      top: 111px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e5ebe7;
      z-index: 4;
    }

    .ticket::before {
      left: -9px;
    }

    .ticket::after {
      right: -9px;
    }

    .ticket-glow {
      position: absolute;
      right: -70px;
      bottom: -70px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.17), transparent 66%);
      pointer-events: none;
    }

    .top-row,
    .route-row,
    .passengers,
    .trip-panel,
    .countdown {
      position: relative;
      z-index: 2;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 21px;
    }

    .brand {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.21rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .date-box {
      text-align: right;
    }

    .label {
      display: block;
      font-size: 0.7rem;
      line-height: 1.2;
      letter-spacing: 0.035rem;
      opacity: 0.78;
    }

    .date {
      margin-top: 3px;
      font-size: 0.78rem;
      line-height: 1.25;
      font-weight: 800;
      white-space: nowrap;
    }

    .route-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .route:last-child {
      text-align: right;
    }

    .route small {
      display: block;
      margin-bottom: 4px;
      font-size: 0.77rem;
      opacity: 0.84;
    }

    .code {
      font-size: clamp(2.8rem, 15vw, 3.75rem);
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.055em;
    }

    .plane {
      position: relative;
      transform: translateY(10px);
      color: var(--yellow);
      font-size: 1.48rem;
      text-shadow: 0 4px 12px rgba(0,0,0,0.22);
    }

    .plane::before,
    .plane::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 24px;
      height: 1px;
      background: rgba(255,255,255,0.29);
    }

    .plane::before {
      right: calc(100% + 7px);
    }

    .plane::after {
      left: calc(100% + 7px);
    }

    .passengers {
      padding: 19px 0 18px;
      border-top: 1px dashed rgba(255,255,255,0.34);
      border-bottom: 1px dashed rgba(255,255,255,0.34);
    }

    .passenger-label {
      margin-bottom: 9px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.16rem;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
    }

    .passenger-name {
      font-size: 1.04rem;
      line-height: 1.45;
      font-weight: 800;
    }

    .trip-panel {
      padding: 22px 0 17px;
      text-align: center;
    }

    .trip-kicker {
      font-size: 1.46rem;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.06rem;
    }

    .trip-meta {
      margin-top: 7px;
      font-size: 0.83rem;
      opacity: 0.83;
    }

    .confirmed {
      width: fit-content;
      margin: 17px auto 0;
      padding: 8px 13px;
      border: 1px solid rgba(247, 209, 23, 0.65);
      border-radius: 999px;
      color: var(--yellow);
      background: rgba(247, 209, 23, 0.09);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.12rem;
    }

    .countdown {
      margin-top: 2px;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,0.16);
      text-align: center;
      font-size: 0.79rem;
      color: rgba(255,255,255,0.76);
    }

    .countdown strong {
      color: var(--white);
      font-size: 0.98rem;
    }

    .countdown.finished {
      color: var(--yellow);
      font-weight: 800;
    }

    /* -----------------------------
       OPENING ANIMATION
    ----------------------------- */

    .experience.opened .pack {
      animation: packOpen 1.05s cubic-bezier(.2,.75,.18,1) forwards;
    }

    .experience.opened .pack-seal.top {
      animation: ripSeal 0.72s cubic-bezier(.2,.8,.3,1) 0.12s forwards;
    }

    .experience.opened .tear-line {
      animation: tearAway 0.55s ease 0.08s forwards;
    }

    .experience.opened .ticket-wrap {
      animation: revealTicket 1.05s cubic-bezier(.16,.84,.27,1) 0.53s forwards;
    }

    .experience.opened .pack-button {
      pointer-events: none;
      animation: removePack 0.32s ease 1.28s forwards;
    }

    .experience.opened .ticket > * {
      animation: contentIn 0.55s ease both;
    }

    .experience.opened .ticket .top-row {
      animation-delay: 1.18s;
    }

    .experience.opened .ticket .route-row {
      animation-delay: 1.28s;
    }

    .experience.opened .ticket .passengers {
      animation-delay: 1.38s;
    }

    .experience.opened .ticket .trip-panel {
      animation-delay: 1.48s;
    }

    .experience.opened .ticket .countdown {
      animation-delay: 1.58s;
    }

    @keyframes packFloat {
      0%, 100% {
        transform: translateY(0) rotateZ(-0.5deg);
      }
      50% {
        transform: translateY(-8px) rotateZ(0.6deg);
      }
    }

    @keyframes hintPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 26px rgba(247, 209, 23, 0.16);
      }
      50% {
        transform: scale(1.035);
        box-shadow: 0 14px 34px rgba(247, 209, 23, 0.28);
      }
    }

    @keyframes ripSeal {
      0% {
        transform: translate(0, 0) rotate(0);
      }
      40% {
        transform: translate(5px, -8px) rotate(3deg);
      }
      100% {
        transform: translate(145px, -105px) rotate(26deg);
        opacity: 0;
      }
    }

    @keyframes tearAway {
      to {
        transform: translateX(55px);
        opacity: 0;
      }
    }

    @keyframes packOpen {
      0% {
        transform: translateY(0) scale(1) rotateX(0);
        opacity: 1;
      }
      36% {
        transform: translateY(18px) scale(1.04, 0.96) rotateX(0);
      }
      100% {
        transform: translateY(126px) scale(1.07, 0.56) rotateX(18deg);
        opacity: 0;
        filter: blur(4px);
      }
    }

    @keyframes removePack {
      to {
        visibility: hidden;
        opacity: 0;
      }
    }

    @keyframes revealTicket {
      0% {
        opacity: 0;
        transform: translateY(94px) scale(0.82) rotateX(12deg);
        filter: blur(6px);
      }
      52% {
        opacity: 1;
        transform: translateY(-18px) scale(1.025) rotateX(0);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0);
        filter: blur(0);
        pointer-events: auto;
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 430px) {
      body {
        padding: 18px 14px;
      }

      .experience {
        min-height: 575px;
      }

      .pack-button {
        width: 260px;
        height: 430px;
      }

      .pack-logo {
        width: 102px;
        height: 102px;
        margin-top: 36px;
        font-size: 2.8rem;
      }

      .pack-title {
        margin-top: 25px;
        font-size: 1.2rem;
      }

      .ticket {
        padding: 22px 18px 20px;
        border-radius: 22px;
      }

      .brand {
        max-width: 150px;
        white-space: normal;
        line-height: 1.3;
      }

      .date {
        font-size: 0.72rem;
      }

      .code {
        font-size: clamp(2.65rem, 15vw, 3.35rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .experience.opened .pack-button {
        display: none;
      }

      .experience.opened .ticket-wrap {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <main class="experience" id="experience">
    <button
      class="pack-button"
      id="openPack"
      type="button"
      aria-label="Reisepaket öffnen"
      aria-controls="boardingTicket"
      aria-expanded="false"
    >
      <div class="pack" aria-hidden="true">
        <div class="pack-seal top"></div>
        <div class="pack-seal bottom"></div>
        <div class="tear-line"></div>

        <div class="pack-content">
          <div class="edition">BARCELONA EDITION</div>
          <div class="pack-logo">09</div>
          <div class="pack-title">Null Neun Air</div>
          <div class="pack-subtitle">2 PASSAGIERE · 1 TRIP</div>

          <div class="tap-hint">
            <span class="tap-icon">↗</span>
            Zum Öffnen antippen
          </div>
        </div>
      </div>
    </button>

    <section class="ticket-wrap" id="boardingTicket" aria-hidden="true">
      <article class="ticket">
        <div class="ticket-glow"></div>

        <header class="top-row">
          <div class="brand">Null Neun Air</div>

          <div class="date-box">
            <span class="label">Reisedatum</span>
            <div class="date">08.04.2027 – 11.04.2027</div>
          </div>
        </header>

        <div class="route-row">
          <div class="route">
            <small>Hamburg</small>
            <div class="code">HAM</div>
          </div>

          <div class="plane" aria-hidden="true">✈</div>

          <div class="route">
            <small>Barcelona</small>
            <div class="code">BCN</div>
          </div>
        </div>

        <section class="passengers" aria-label="Passagiere">
          <div class="passenger-label">Passagiere</div>
          <div class="passenger-name">Friedemann Peters</div>
          <div class="passenger-name">Jakob Peters</div>
        </section>

        <section class="trip-panel">
          <div class="trip-kicker">BROTHERS TRIP</div>
          <div class="trip-meta">3 Nächte · Barcelona · April 2027</div>
          <div class="confirmed">REISE BESTÄTIGT</div>
        </section>

        <div class="countdown" id="countdown" aria-live="polite">
          Noch <strong id="countdownDays">–</strong> Tage bis zum Boarding
        </div>
      </article>
    </section>
  </main>

  <script>
    const experience = document.getElementById("experience");
    const openPackButton = document.getElementById("openPack");
    const boardingTicket = document.getElementById("boardingTicket");
    const countdown = document.getElementById("countdown");
    const countdownDays = document.getElementById("countdownDays");

    function openPack() {
      if (experience.classList.contains("opened")) return;

      experience.classList.add("opened");
      openPackButton.setAttribute("aria-expanded", "true");

      window.setTimeout(() => {
        boardingTicket.setAttribute("aria-hidden", "false");
      }, 530);
    }

    openPackButton.addEventListener("click", openPack);

    /*
      Der Countdown orientiert sich an der lokalen Uhrzeit des Geräts.
      Durch Math.ceil() sinkt die Anzeige jeweils nach Mitternacht um einen Tag.
    */
    const departureDate = new Date(2027, 3, 8, 0, 0, 0);

    function updateCountdown() {
      const now = new Date();
      const difference = departureDate.getTime() - now.getTime();

      if (difference <= 0) {
        countdown.textContent = "Boarding für Barcelona!";
        countdown.classList.add("finished");
        return;
      }

      const millisecondsPerDay = 1000 * 60 * 60 * 24;
      const daysRemaining = Math.ceil(difference / millisecondsPerDay);

      countdownDays.textContent = daysRemaining.toLocaleString("de-DE");
    }

    updateCountdown();
    window.setInterval(updateCountdown, 60 * 1000);
  </script>
</body>
</html>
